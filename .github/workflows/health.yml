name: qexus lab · Daily site health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/health.yml'
      - 'scripts/monitor_sites.py'
      - 'tests/test_monitor_sites.py'
      - 'scripts/build_sitemap.py'
      - 'tests/test_sitemap.py'
      - 'tests/check_i18n.mjs'
      - 'tests/check_static_language_labels.mjs'
      - 'fr/**'
      - 'uk/**'
      - 'shared/site-i18n.js'
      - 'shared/site-i18n.css'
      - 'shared/qx-footer.css'
      - 'shared/candidate-journey.js'
      - 'shared/candidate-journey.css'
      - 'shared/fisheries-router.js'
      - 'tests/check_journey.mjs'
      - 'shared/candidate-desk.js'
      - 'shared/candidate-desk.css'
      - 'tests/check_desk.mjs'
      - 'shared/practicum.js'
      - 'shared/practicum.css'
      - 'tests/check_practicum.mjs'
      - 'sitemap.xml'
      - 'site-map.html'
  schedule:
    - cron: '37 10 * * *' # daily 10:37 UTC, best effort
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test health-check rules
        run: python -m unittest discover -s tests -v
      - name: Test language navigation
        run: |
          node tests/check_i18n.mjs
          node tests/check_static_language_labels.mjs
      - name: Test candidate journey (Norway and Canada)
        run: |
          node --check shared/candidate-journey.js
          node --check shared/fisheries-router.js
          node tests/check_journey.mjs
          node --check shared/candidate-desk.js
          node tests/check_desk.mjs
          node --check shared/practicum.js
          node tests/check_practicum.mjs
      - name: Check all four projects, sitemap, and official snapshot sizes
        run: python scripts/monitor_sites.py --output site-health.json
      - name: Attach read-only health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qexus-health-report
          path: site-health.json
          if-no-files-found: warn
          retention-days: 14
